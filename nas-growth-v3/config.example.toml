[project]
name = "CCTV 家庭成长档案 V3 (NAS 无人值守版)"
birthday = "2025-01-01"
cctv_root = "/cctv"
vault_root = "/vault"
data_root = "/data"
timezone = "Asia/Shanghai"

[scheduler]
# P0 (Today & Yesterday) scan cadence and file stabilization cooldowns
p0_interval_seconds = 900
active_file_cooldown_seconds = 5400
closed_file_cooldown_seconds = 900
# Guard host Free RAM so >= 4.0 GiB MemAvailable is always reserved
min_host_mem_available_kib = 4194304
asr_min_host_mem_available_kib = 4456448
# Additional admission checks against the container's own cgroup memory budget.
worker_container_headroom_kib = 393216
asr_min_container_headroom_kib = 1310720
workers = 4
max_heavy_workers = 2
rolling_active_days = 2
light_spillover_days = 2
p0_preview_active_threshold = 20
p1_start_day = "2025-12-01"
p1_end_day = "2025-01-01"
p1_chunk_files = 48

[lifecycle]
# Hard source protection: raw /cctv stays untouched until Baidu first-time backup + P1 backfill both 100% finish.
# After completion, raw /cctv videos do not go to Baidu Cloud anymore (baidu daily_enabled=false) and stay locally for N days.
source_retention_days = 90
retention_mode = "observe_only"
protect_vault_forever = true
baidu_status_url = "http://192.168.1.100:8791/status.json"
archive_cloud_sync_enabled = true
defer_archive_sync_until_source_backup_done = true
openlist_url = "http://192.168.1.100:5244"
openlist_credentials = "/run/secrets/openlist.json"
openlist_destination = "/Growth_Archive_V3"
# Compile on the 18th so the 17th (full-month/birthday day) finishes recording & P0 archiving first.
monthly_compile_day = 18

[media]
vaapi_device = "/dev/dri/renderD128"
prefer_vaapi = true
t1_height = 720
t1_fps = 15
t1_qp = 28
t2_height = 720
t2_fps = 30
t2_qp = 30
highlight_qp = 19
smooth_qp = 19
font_candidates = [
  "/host_fonts/simsun.ttc",
  "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
  "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
]

[asr]
enabled = true
model_dir = "/app/models/whisper-v3-turbo-int8"
yamnet_model = "/app/models/yamnet.tflite"
yamnet_class_map = "/app/models/yamnet_class_map.csv"
yolo_onnx = "/app/models/yolo26s.onnx"
max_bursts_per_day = 240
max_files_per_day = 360

[vlm]
# Dual-tier flagship parallel routing: Gemini 4 + Qwen4-Max + GPT-6.2-Sol + DeepSeek-V4.1-Flash with automatic failover
# Secrets are loaded strictly from /run/secrets/* inside RAM; never logged or stored in DB.
request_timeout_seconds = 45
max_slots_per_model = 2
max_image_edge = 768
jpeg_quality = 85
cooldown_seconds = 600
rate_limit_cooldown_seconds = 120
quota_cooldown_seconds = 21600
fast_concurrency = 6
pro_concurrency = 4
kitchen_batch_size = 56

[vlm.providers.vertex_1_hydrogen]
kind = "vertex"
model = "gemini-4-hydrogen"
location = "global"
api_version = "v1beta1"
secret_file = "/run/secrets/gcp_vertex_sa_1.json"
thinking_level = "LOW"
timeout_seconds = 25
max_output_tokens = 1536
worker_slots = 1

[vlm.providers.vertex_2_hydrogen]
kind = "vertex"
model = "gemini-4-hydrogen"
location = "global"
api_version = "v1beta1"
secret_file = "/run/secrets/gcp_vertex_sa_2.json"
thinking_level = "LOW"
timeout_seconds = 25
max_output_tokens = 1536
worker_slots = 1

[vlm.providers.vertex_1_carbon]
kind = "vertex"
model = "gemini-4-carbon"
location = "global"
api_version = "v1beta1"
secret_file = "/run/secrets/gcp_vertex_sa_1.json"
thinking_level = "LOW"
timeout_seconds = 30
max_output_tokens = 2048
worker_slots = 1

[vlm.providers.vertex_2_carbon]
kind = "vertex"
model = "gemini-4-carbon"
location = "global"
api_version = "v1beta1"
secret_file = "/run/secrets/gcp_vertex_sa_2.json"
thinking_level = "LOW"
timeout_seconds = 30
max_output_tokens = 2048
worker_slots = 1

[vlm.providers.gemini_hydrogen]
kind = "gemini"
model = "gemini-4-hydrogen"
base_url = "https://generativelanguage.googleapis.com/v1beta"
secret_file = "/run/secrets/gemini_api_key"
thinking_level = "LOW"
max_output_tokens = 1536
worker_slots = 2

[vlm.providers.gemini_carbon]
kind = "gemini"
model = "gemini-4-carbon"
base_url = "https://generativelanguage.googleapis.com/v1beta"
secret_file = "/run/secrets/gemini_api_key"
thinking_level = "LOW"
max_output_tokens = 2048
worker_slots = 2

[vlm.providers.gpt_62_sol]
kind = "openai"
model = "gpt-6.2-sol"
fallback_models = ["gpt-6.1-sol", "gpt-6-sol"]
display_model = "gpt-6.2-sol"
base_url = "http://192.168.1.100:8317/v1"
secret_file = "/run/secrets/cliproxy_api_key"
supports_reasoning_effort = true
max_output_tokens = 1200
worker_slots = 2

[vlm.providers.qwen4_max]
kind = "openai"
model = "qwen4-max"
base_url = "https://token-plan.maas.qianwenaiapi.com/compatible-mode/v1"
secret_file = "/run/secrets/qwen_api_key"
enable_thinking = false
expires_at = "2026-11-26T00:00:00+08:00"
max_output_tokens = 1200
worker_slots = 2

[vlm.providers.deepseek_v41_flash]
kind = "openai"
model = "DeepSeek-V4.1-Flash-1017"
fallback_model = "deepseek-v4.1-flash-1017"
display_model = "DeepSeek-V4.1-Flash-1017"
base_url = "https://token-plan.maas.qianwenaiapi.com/compatible-mode/v1"
secret_file = "/run/secrets/qwen_api_key"
enable_thinking = false
omit_temperature = true
single_image_collage = true
expires_at = "2026-11-26T00:00:00+08:00"
max_output_tokens = 1200
worker_slots = 2

[vlm.parallel_tiers]
fast = ["qwen4_max", "deepseek_v41_flash", "gpt_62_sol", "gemini_hydrogen", "vertex_1_hydrogen", "vertex_2_hydrogen"]
pro  = ["gpt_62_sol", "qwen4_max", "gemini_carbon", "vertex_1_carbon", "vertex_2_carbon"]
director = ["gemini_carbon", "gpt_62_sol"]

[vlm.tiers]
fast = ["qwen4_max", "deepseek_v41_flash", "gpt_62_sol", "gemini_hydrogen", "vertex_1_hydrogen", "vertex_2_hydrogen"]
pro  = ["gpt_62_sol", "qwen4_max", "gemini_carbon", "vertex_1_carbon", "vertex_2_carbon", "gemini_hydrogen"]
director = ["gemini_carbon", "gpt_62_sol", "vertex_1_carbon", "vertex_2_carbon"]

[vlm.tier_overrides.director]
thinking_level = "HIGH"
reasoning_effort = "high"
timeout_seconds = 150
gemini_max_output_tokens = 8192
openai_max_output_tokens = 4096

