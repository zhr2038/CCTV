[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-family-ai"
version = "0.1.0"
description = "Privacy-first, read-only indexing for family CCTV archives"
requires-python = ">=3.11"
dependencies = [
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
watermark-ocr = [
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.23,<2",
  "opencv-python>=4.10,<6",
  "rapidocr>=3.8,<4",
]
audio-events = [
  "ai-edge-litert>=2.1,<3",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=1.26,<3",
]
web = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1",
]
visual = [
  "accelerate>=1.12,<2",
  "bitsandbytes>=0.50,<1",
  "modelscope>=1.39,<2",
  "opencv-python>=4.10,<6",
  "qwen-vl-utils>=0.0.14,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.12,<2.14",
  "torchvision>=0.27,<0.29",
  "transformers>=4.57,<5",
  "ultralytics>=8.4.111,<9",
]

[project.scripts]
cctv-ai = "cctv_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cctv_ai = ["web_static/*"]
